<div class="card">
    <h1>All Images</h1>
    <table>
        <thead>
            <tr>
                <th>File</th>
                <th>Original name</th>
                <th>Size</th>
                <th>Uploaded</th>
                <th>Type</th>
                <th></th>
            </tr>
        </thead>
        <tbody>
            {rows}
        </tbody>
    </table>
    <nav class="pagination">
        {prev_link}
        <span class="page-num">Page {page}</span>
        {next_link}
    </nav>
</div>
