      description: |-
        POST /api/v1/contact/ — аналог contact() з apps.shop.views.

        Як і шаблонна версія, нікуди не зберігає звернення — тільки пише в консоль
        (у шаблонах був print, тут — логер, як у сигналах accounts).
      tags:
      - v1
      security:
      - jwtAuth: []
      - cookieAuth: []
      - {}
      responses:
        '200':
          description: No response body
  /api/v1/products/:
    get:
      operationId: v1_products_list
      parameters:
      - in: query
        name: audience
        schema:
          type: array
          items:
            type: string
            title: Аудиторія
            enum:
            - man
            - unisex
            - woman
        description: |-
          * `unisex` - Унісекс
          * `man` - Чоловіче
          * `woman` - Жіноче
        explode: true
        style: form
      - in: query
        name: brand
        schema:
          type: array
          items:
            type: string
        explode: true
        style: form
      - in: query
        name: category
        schema:
          type: array
          items:
            type: string
        explode: true
        style: form
      - in: query
        name: in_stock
        schema:
          type: boolean
        description: Чи є в наявності
      - in: query
        name: is_active
        schema:
          type: boolean
      - in: query
        name: is_featured
        schema:
          type: boolean
      - in: query
        name: max_price
        schema:
