openapi: 3.0.3
info:
  title: ПОТУЖНО Shop API
  version: 1.0.0
  description: API інтернет-магазину одягу та взуття
paths:
  /api/v1/auth/register/:
    post:
      operationId: v1_auth_register_create
      description: |-
        POST /api/v1/auth/register/ — аналог register() з apps.accounts.views.

        Шаблонна в'юшка після створення користувача одразу логінила його
        (login(request, user)). Для API "залогінити" = видати пару JWT-токенів,
        тому повертаємо їх разом із даними користувача.
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Register'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Register'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Register'
        required: true
      security:
      - jwtAuth: []
      - cookieAuth: []
      - {}
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Register'
          description: ''
  /api/v1/brands/:
    get:
      operationId: v1_brands_list
      description: |-
        Category/Brand звʼязані з Product через on_delete=PROTECT: видалення запису,
        на який посилаються товари, кидає ProtectedError. Без цього міксина DRF
        відповів би 500 — перетворюємо на зрозумілий 409 Conflict.
      parameters:
      - name: ordering
        required: false
        in: query
        description: Which field to use when ordering the results.
        schema:
          type: string
      - name: page_number
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - name: search
        required: false
        in: query
        description: A search term.
        schema:
          type: string
      tags:
      - v1
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedBrandList'
          description: ''
    post:
      operationId: v1_brands_create
